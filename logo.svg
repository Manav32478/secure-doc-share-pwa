<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3" flood-color="#000000"/>
    </filter>
  </defs>
  
  <!-- Main Circle Background -->
  <circle cx="128" cy="128" r="120" fill="url(#logoGradient)" filter="url(#shadow)"/>
  
  <!-- Document/Shield Icon -->
  <g transform="translate(128, 128)">
    <!-- Shield Shape -->
    <path d="M -40 -35 L -40 0 Q -40 40 0 55 Q 40 40 40 0 L 40 -35 Z" 
          fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Checkmark inside shield -->
    <g transform="translate(0, 8)">
      <!-- Checkmark -->
      <path d="M -15 0 L -5 10 L 15 -10" 
            fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Lock accent at bottom -->
    <circle cx="0" cy="40" r="6" fill="white"/>
  </g>
  
  <!-- Text Ring (Optional - can be used with company name) -->
  <defs>
    <path id="circlePath" d="M 50, 128 A 78, 78 0 0, 1 206, 128" fill="none"/>
  </defs>
  
  <!-- Accent dots at corners for modern look -->
  <circle cx="30" cy="30" r="5" fill="white" opacity="0.3"/>
  <circle cx="226" cy="226" r="5" fill="white" opacity="0.3"/>
  <circle cx="226" cy="30" r="3" fill="white" opacity="0.2"/>
  <circle cx="30" cy="226" r="3" fill="white" opacity="0.2"/>
</svg>
