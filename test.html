<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test - SecureVault</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }
    .status {
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
      font-size: 16px;
    }
    .success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .loading {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    button {
      padding: 10px 20px;
      margin: 10px 5px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: #007bff;
      color: white;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <h1>🔧 SecureVault - Connection Test</h1>

  <div id="status" class="status loading">Testing connections...</div>

  <div>
    <button onclick="testSupabase()">Test Supabase</button>
    <button onclick="testFirebase()">Test Firebase</button>
    <button onclick="testLocal()">Test Local</button>
  </div>

  <script type="module">
    async function testSupabase() {
      const status = document.getElementById('status');
      status.className = 'status loading';
      status.innerHTML = '⏳ Testing Supabase import...';

      try {
        const module = await import('./js/supabase.js');
        status.className = 'status success';
        status.innerHTML = '✅ Supabase module loaded successfully!<br>URL: ' + module.SUPABASE_URL;
      } catch (err) {
        status.className = 'status error';
        status.innerHTML = '❌ Supabase Error: ' + err.message;
      }
    }

    async function testFirebase() {
      const status = document.getElementById('status');
      status.className = 'status loading';
      status.innerHTML = '⏳ Testing Firebase import...';

      try {
        const module = await import('./js/firebase.js');
        status.className = 'status success';
        status.innerHTML = '✅ Firebase module loaded successfully!<br>Project: doc-share-55636';
      } catch (err) {
        status.className = 'status error';
        status.innerHTML = '❌ Firebase Error: ' + err.message;
      }
    }

    function testLocal() {
      const status = document.getElementById('status');
      status.className = 'status success';
      status.innerHTML = '✅ Local server is working!<br>You can access the app at http://localhost:8000';
    }

    // Auto test on load
    window.addEventListener('load', testSupabase);
  </script>
</body>
</html>
